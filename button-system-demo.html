<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Design System — Anh Tư</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{min-height:100vh;background:linear-gradient(135deg,#130a12,#321427);padding:48px 20px;color:#fff}
    .demo{width:min(100%,1100px);margin:auto}
    .demo h1{font-family:var(--serif);font-size:clamp(3rem,8vw,6rem);line-height:.9;margin:0 0 18px}
    .demo p{max-width:720px;color:rgba(255,255,255,.65)}
    .demo-grid{display:grid;gap:24px;margin-top:40px}
    .demo-card{padding:24px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.05);backdrop-filter:blur(18px)}
    .demo-card h2{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:#ffd889}
    .demo-row{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
    @media(max-width:640px){.demo-row{display:grid}.demo-row .ds-btn{width:100%}}
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>
<body>
  <main class="demo">
    <h1>Button<br><em>Design System</em></h1>
    <p>Hệ thống nút bấm dùng chung cho website ca sĩ Anh Tư với chiều cao 48–56px, bo góc 16px, icon + label, gradient, glow và đầy đủ trạng thái.</p>

    <section class="demo-grid">
      <article class="demo-card">
        <h2>Primary</h2>
        <div class="demo-row">
          <a class="ds-btn ds-btn--primary" href="#"><span class="ds-btn__label">Nghe nhạc</span></a>
          <a class="ds-btn ds-btn--primary" href="#"><span class="ds-btn__label">Xem MV</span></a>
          <a class="ds-btn ds-btn--primary" href="#"><span class="ds-btn__label">Booking</span></a>
        </div>
      </article>

      <article class="demo-card">
        <h2>Outline / Glass / Text</h2>
        <div class="demo-row">
          <button class="ds-btn ds-btn--outline">Outline</button>
          <button class="ds-btn ds-btn--glass">Glass</button>
          <button class="ds-btn ds-btn--text">Text Button →</button>
        </div>
      </article>

      <article class="demo-card">
        <h2>Sizes</h2>
        <div class="demo-row">
          <button class="ds-btn ds-btn--primary ds-btn--sm">48px</button>
          <button class="ds-btn ds-btn--primary">52px</button>
          <button class="ds-btn ds-btn--primary ds-btn--lg">56px</button>
        </div>
      </article>

      <article class="demo-card">
        <h2>States</h2>
        <div class="demo-row">
          <button class="ds-btn ds-btn--primary">Default</button>
          <button class="ds-btn ds-btn--primary" autofocus>Focus</button>
          <button class="ds-btn ds-btn--primary" disabled>Disabled</button>
        </div>
      </article>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
